<div class="pedidos-page-wrapper">
    <div class="pedidos-content-area">
        <!-- Header da Página -->
        <div class="col-12">
            <div class="card border-0 shadow-sm bg-white rounded-4 overflow-hidden">
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="row g-3 mt-0">
            
                
                            <!-- Filtros de Status -->
                            <div class="ped-status-icons" aria-label="Filtros por status">
                                <div class="ped-status-action-item active" id="ped-filter-todos"
                                    data-status-filter="todos" role="button" tabindex="0"
                                    aria-label="Todos">
                                    <div class="ped-status-action-icon ped-icon-todos ped-icon-lg">
                                        <i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>
                                    </div>
                                </div>

                                <div class="ped-status-action-item" id="ped-filter-pendente"
                                    data-status-filter="pendente" role="button" tabindex="0"
                                    aria-label="Pendentes">
                                    <div class="ped-status-action-icon ped-icon-pendente ped-icon-lg">
                                        <i class="bi bi-hourglass-split" aria-hidden="true"></i>
                                    </div>
                                </div>

                                <div class="ped-status-action-item" id="ped-filter-em_rota"
                                    data-status-filter="em_rota" role="button" tabindex="0"
                                    aria-label="Em rota">
                                    <div class="ped-status-action-icon ped-icon-em-rota ped-icon-lg">
                                        <i class="bi bi-signpost-split-fill" aria-hidden="true"></i>
                                    </div>
                                </div>

                                <div class="ped-status-action-item" id="ped-filter-concluido"
                                    data-status-filter="concluido" role="button" tabindex="0"
                                    aria-label="Concluídos">
                                    <div class="ped-status-action-icon ped-icon-concluido ped-icon-lg">
                                        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                                    </div>
                                </div>

                                <div class="ped-status-action-item" id="ped-filter-cancelado"
                                    data-status-filter="cancelado" role="button" tabindex="0"
                                    aria-label="Cancelados">
                                    <div class="ped-status-action-icon ped-icon-cancelado ped-icon-lg">
                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                    </div>
                                </div>

                                <div class="ped-status-action-item" id="ped-filter-pendente_financeiro"
                                    data-status-filter="pendente_financeiro" role="button" tabindex="0"
                                    aria-label="A receber">
                                    <div class="ped-status-action-icon ped-icon-financeiro ped-icon-lg">
                                        <i class="bi bi-cash-coin" aria-hidden="true"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-end gap-2 flex-wrap">                                
                                <div class="posicao-busca-wrapper">
                                    <input type="text" id="filtro-pedidos"
                                        class="form-control form-control-sm rounded-pill input-filtro-pedidos"
                                        placeholder="Buscar..." autocomplete="off" aria-label="Buscar pedidos">
                                    <button type="button" id="btn-limpar-busca-pedidos" class="btn-limpar-busca d-none"
                                        title="Limpar busca" aria-label="Limpar busca">
                                        <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                                    </button>
                                </div>

                                <button id="btn-loop-pedidos" class="btn-sync-pedidos" title="Atualizar pedidos"
                                    aria-label="Atualizar pedidos">
                                    <i id="icon-loop-pedidos" class="bi bi-arrow-repeat" aria-hidden="true"></i>
                                </button>

                                <div class="calendario-btn-wrapper">
                                    <input type="date" id="filtro-data-pedidos" class="input-filtro-data-pedidos-hidden"
                                        title="Filtrar por data" aria-label="Data do filtro">
                                    <button type="button" id="btn-abrir-calendario-pedidos" class="btn-icon-calendario"
                                        title="Filtrar por data" aria-label="Abrir calendário">
                                        <i class="bi bi-calendar3" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                    <!-- Tabela de Pedidos & Overlay de Carregamento -->
                    
                        <div id="pedidos-loading-overlay" class="pedidos-loading-overlay">
                            <div class="pedidos-loading-content" id="pedidos-loading-state">
                                <i class="bi bi-search pedidos-loading-spin" aria-hidden="true"></i>
                                <span class="pedidos-loading-text">Buscando pedidos<span
                                        class="pedidos-loading-dots"><span>.</span><span>.</span><span>.</span></span></span>
                            </div>
                            <div class="pedidos-error-content d-none" id="pedidos-error-state">
                                <i class="bi bi-exclamation-triangle-fill pedidos-error-icon-overlay"
                                    aria-hidden="true"></i>
                                <span class="pedidos-error-text" id="pedidos-error-text">Ocorreu um erro ao buscar os
                                    pedidos.</span>
                                <button type="button" class="btn btn-sm btn-outline-danger mt-2" id="btn-retry-pedidos">
                                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Tentar novamente
                                </button>
                            </div>
                        </div>

                        <div id="pedidos-error-container" class="pedidos-error-container"></div>
                        <template id="tpl-pedidos-error-toast">
                            <div class="pedidos-error-toast" role="alert">
                                <i class="bi bi-exclamation-triangle-fill pedidos-error-icon" aria-hidden="true"></i>
                                <div class="pedidos-error-msg"></div>
                                <button type="button" class="pedidos-error-close" title="Fechar"
                                    aria-label="Fechar mensagem de erro">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                </button>
                            </div>
                        </template>

                        <table class="table table-hover align-middle border-0 mb-0" id="tabela-pedidos">
                            <thead class="text-uppercase tabela-pedidos-head">
                                <tr>
                                    <th scope="col" class="ps-3 border-0 fw-normal">
                                        <button id="btn-sort-data-pedidos"
                                            class="btn btn-link p-0 text-decoration-none text-dark d-flex align-items-center gap-1">
                                            Data <i id="icon-sort-data-pedidos" class="bi bi-arrow-down"
                                                aria-hidden="true"></i>
                                        </button>
                                    </th>
                                    <th scope="col" class="border-0 fw-normal">Cliente</th>
                                    <th scope="col" class="border-0 fw-normal d-none d-md-table-cell">N. Serviço</th>
                                    <th scope="col" class="border-0 fw-normal">Status</th>
                                    <th scope="col" class="text-end pe-3 border-0 fw-normal">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela-pedidos"></tbody>
                        </table>
                    

                    <!-- Paginação -->
                    
                    <div class="pedidos-paginacao">
                        <div class="btn-group shadow-sm" role="group" aria-label="Navegação de paginação">
                                                    <button class="btn btn-light" id="btn-pag-prev-pedidos" aria-label="Página anterior">
                                                        <i class="bi bi-chevron-left" aria-hidden="true"></i>
                                                    </button>
                                                    <button class="btn btn-light" id="info-paginacao-pedidos" disabled>
                                                        Pág 1
                                                    </button>
                                                    <button class="btn btn-light" id="btn-pag-next-pedidos" aria-label="Próxima página">
                                                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                                                    </button>
                                                </div>
                    </div>
                
            
        </div>

        <!-- Containers Ocultos de Apoio -->
        <div id="pedidos-pendentes" class="d-none"></div>
        <div id="pedidos-andamento" class="d-none"></div>
        <div id="pedidos-finalizados" class="d-none"></div>
    </div>

    <!-- Container de Modais -->
    <div id="modal-pedidos-container"></div>
</div>
