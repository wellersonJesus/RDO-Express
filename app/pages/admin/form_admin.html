<div class="modal fade" id="modalFormAdmin" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-pedido-edit-dialog">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-pedido-header d-flex align-items-center gap-3">
                <div class="modal-pedido-icon"><i id="form-admin-icone" class="bi bi-building"></i></div>
                <div>
                    <div class="modal-pedido-title" id="form-admin-titulo">Novo Cliente</div>
                    <div class="modal-pedido-subtitle" id="form-admin-subtitulo">Dados da empresa cliente</div>
                </div>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-pedido-body">
                <form id="form-admin">
                    <div id="form-admin-erro" class="alert alert-danger d-none rounded-3 py-2 px-3 mb-3" style="font-size:0.8rem;"></div>

                    <div id="campos-cliente">
                        <div class="modal-pedido-section-label">
                            <i class="bi bi-building me-1 text-danger"></i>Dados do Cliente
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Nome / Razão Social</label>
                                <input type="text" id="c-username" class="form-control form-control-sm modal-pedido-input" placeholder="Nome do cliente">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Responsável</label>
                                <input type="text" id="c-responsavel" class="form-control form-control-sm modal-pedido-input" placeholder="Nome do responsável">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Contato</label>
                                <input type="text" id="c-contato" class="form-control form-control-sm modal-pedido-input" placeholder="(00) 00000-0000">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Status</label>
                                <select id="c-status" class="form-select form-select-sm modal-pedido-input">
                                    <option value="TRUE">Ativo</option>
                                    <option value="FALSE">Inativo</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Forma de Pagamento</label>
                                <select id="c-pagamento" class="form-select form-select-sm modal-pedido-input">
                                    <option value="">Selecione...</option>
                                    <option value="DIÁRIO IMEDIATO">Diário Imediato</option>
                                    <option value="SEMANAL (SEGUNDA - FINAL DO DIA)">Semanal (Segunda - Final do dia)</option>
                                    <option value="QUINZENAL (QUINTA, SEXTA E SEGUNDA)">Quinzenal (Quinta, Sexta e Segunda)</option>
                                    <option value="MENSAL">Mensal</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-6 d-none" id="div-dia-fechamento">
                                <label class="modal-pedido-field-label">Dia de Fechamento</label>
                                <input type="text" id="c-dia_fechamento" class="form-control form-control-sm modal-pedido-input" readonly>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12">
                                <label class="modal-pedido-field-label">URL da Imagem / Logo</label>
                                <input type="text" id="c-imagem" class="form-control form-control-sm modal-pedido-input" placeholder="https://...">
                            </div>
                        </div>
                    </div>

                    <div id="campos-colaborador" class="d-none">
                        <div class="modal-pedido-section-label">
                            <i class="bi bi-person-badge-fill me-1 text-danger"></i>Dados do Colaborador
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Nome</label>
                                <input type="text" id="col-username" class="form-control form-control-sm modal-pedido-input" placeholder="Nome do colaborador">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">CPF / CNPJ</label>
                                <input type="text" id="col-cpf_cnpj" class="form-control form-control-sm modal-pedido-input" placeholder="000.000.000-00">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Contato</label>
                                <input type="text" id="col-contato" class="form-control form-control-sm modal-pedido-input" placeholder="(00) 00000-0000">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">E-mail</label>
                                <input type="email" id="col-email" class="form-control form-control-sm modal-pedido-input" placeholder="email@exemplo.com">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12">
                                <label class="modal-pedido-field-label">Função(ões)</label>
                                <div class="d-flex gap-3 flex-wrap">
                                    <div class="form-check">
                                        <input class="form-check-input col-funcao" type="checkbox" value="Motoboy" id="fn-motoboy">
                                        <label class="form-check-label" for="fn-motoboy" style="font-size:0.8rem;">Motoboy</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input col-funcao" type="checkbox" value="Atendente" id="fn-atendente">
                                        <label class="form-check-label" for="fn-atendente" style="font-size:0.8rem;">Atendente</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input col-funcao" type="checkbox" value="Administrador" id="fn-admin">
                                        <label class="form-check-label" for="fn-admin" style="font-size:0.8rem;">Administrador</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2 mb-3 d-none" id="div-comissao">
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Comissão (%)</label>
                                <input type="text" id="col-comissao" class="form-control form-control-sm modal-pedido-input" placeholder="Ex: 10">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="modal-pedido-field-label">Status</label>
                                <select id="col-status" class="form-select form-select-sm modal-pedido-input">
                                    <option value="TRUE">Ativo</option>
                                    <option value="FALSE">Inativo</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3" id="div-status-colab-sem-comissao">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-12">
                                <label class="modal-pedido-field-label">URL da Imagem / Foto</label>
                                <input type="text" id="col-imagem" class="form-control form-control-sm modal-pedido-input" placeholder="https://...">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="button" class="btn btn-cancelar-pedido flex-fill" data-bs-dismiss="modal">
                            <i class="bi bi-x-lg me-1"></i>Fechar
                        </button>
                        <button type="button" id="btn-salvar-form-admin" class="btn btn-salvar-pedido flex-fill">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
