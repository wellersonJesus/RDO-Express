<div class="pedidos-page-wrapper">
    <div class="pedidos-content-area">
        <div class="col-12">
            <div class="card border-0 shadow-sm bg-white rounded-4 overflow-hidden">
                <div class="card-body p-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-clipboard2-check fs-3 text-danger"></i>
                        <div>
                            <h5 class="fw-bold mb-0 text-dark">
                                <span class="text-danger">RDO</span> Express - Pedidos
                            </h5>
                            <small class="text-muted pedidos-subtitle">Logística e Controle de Entregas</small>
                        </div>
                    </div>
                    <button id="btn-loop-pedidos" class="btn-sync-pedidos" title="Atualizar pedidos">
                        <i id="icon-loop-pedidos" class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-3 mt-0">
            <div class="col-12">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body pb-0">
                        <div class="d-flex flex-column gap-2">
                            <div class="ped-status-card">
                                <div class="ped-status-card-inner ped-status-grid">
                                    <div class="ped-status-row">
                                        <div class="ped-status-action-item active" id="ped-filter-todos"
                                            data-status-filter="todos">
                                            <div class="ped-status-action-icon ped-icon-todos ped-icon-lg"><i
                                                    class="bi bi-grid-3x3-gap-fill"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">Todos</span>
                                                <span class="ped-status-action-count" id="ped-count-todos">0</span>
                                                <span class="ped-status-action-pct" id="ped-pct-todos">de 0</span>
                                            </div>
                                        </div>
                                        <div class="ped-status-action-item" id="ped-filter-pendente"
                                            data-status-filter="pendente">
                                            <div class="ped-status-action-icon ped-icon-pendente ped-icon-lg"><i
                                                    class="bi bi-hourglass-split"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">Pendentes</span>
                                                <span class="ped-status-action-count" id="ped-count-pendente">0</span>
                                                <span class="ped-status-action-pct" id="ped-pct-pendente">0%</span>
                                            </div>
                                        </div>
                                        <div class="ped-status-action-item" id="ped-filter-em_rota"
                                            data-status-filter="em_rota">
                                            <div class="ped-status-action-icon ped-icon-em-rota ped-icon-lg"><i
                                                    class="bi bi-signpost-split-fill"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">Em Rota</span>
                                                <span class="ped-status-action-count" id="ped-count-em_rota">0</span>
                                                <span class="ped-status-action-pct" id="ped-pct-em_rota">0%</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="ped-status-row">
                                        <div class="ped-status-action-item" id="ped-filter-concluido"
                                            data-status-filter="concluido">
                                            <div class="ped-status-action-icon ped-icon-concluido ped-icon-lg"><i
                                                    class="bi bi-check-circle-fill"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">Concluídos</span>
                                                <span class="ped-status-action-count" id="ped-count-concluido">0</span>
                                                <span class="ped-status-action-pct" id="ped-pct-concluido">0%</span>
                                            </div>
                                        </div>
                                        <div class="ped-status-action-item" id="ped-filter-cancelado"
                                            data-status-filter="cancelado">
                                            <div class="ped-status-action-icon ped-icon-cancelado ped-icon-lg"><i
                                                    class="bi bi-x-circle-fill"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">Cancelados</span>
                                                <span class="ped-status-action-count" id="ped-count-cancelado">0</span>
                                                <span class="ped-status-action-pct" id="ped-pct-cancelado">0%</span>
                                            </div>
                                        </div>
                                        <div class="ped-status-action-item" id="ped-filter-pendente_financeiro"
                                            data-status-filter="pendente_financeiro">
                                            <div class="ped-status-action-icon ped-icon-financeiro ped-icon-lg"><i
                                                    class="bi bi-cash-coin"></i></div>
                                            <div class="ped-status-action-info">
                                                <span class="ped-status-action-label">A Receber</span>
                                                <span class="ped-status-action-count"
                                                    id="ped-count-pendente_financeiro">0</span>
                                                <span class="ped-status-action-pct"
                                                    id="ped-pct-pendente_financeiro">0%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-end gap-2 flex-wrap">
                                <div class="dropdown-filtro-wrapper">
                                    <button class="btn-filtro-inteligente" id="btn-filtro-tipo">
                                        <i class="bi bi-funnel-fill"></i>
                                        <span id="label-filtro-tipo">Todos</span>
                                        <i class="bi bi-chevron-down chevron-filtro"></i>
                                    </button>
                                    <div class="dropdown-filtro-menu" id="dropdown-filtro-menu">
                                        <div class="dropdown-filtro-item active" data-filtro="todos">
                                            <i class="bi bi-grid-3x3-gap"></i> Todos
                                        </div>
                                        <div class="dropdown-filtro-item" data-filtro="servico">
                                            <i class="bi bi-hash"></i> N.Serviço
                                        </div>
                                        <div class="dropdown-filtro-item" data-filtro="cliente">
                                            <i class="bi bi-person"></i> Cliente
                                        </div>
                                    </div>
                                </div>

                                <div class="posicao-busca-wrapper">
                                    <input type="text" id="filtro-pedidos"
                                        class="form-control form-control-sm rounded-pill input-filtro-pedidos"
                                        placeholder="Buscar..." autocomplete="off">
                                    <button type="button" id="btn-limpar-busca-pedidos" class="btn-limpar-busca d-none"
                                        title="Limpar busca">
                                        <i class="bi bi-x-circle-fill"></i>
                                    </button>
                                </div>

                                <div class="calendario-btn-wrapper">
                                    <input type="date" id="filtro-data-pedidos" class="input-filtro-data-pedidos-hidden"
                                        title="Filtrar por data">
                                    <button type="button" id="btn-abrir-calendario-pedidos" class="btn-icon-calendario"
                                        title="Filtrar por data">
                                        <i class="bi bi-calendar3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive p-3 pedidos-tabela-wrapper">
                        <div id="pedidos-loading-overlay" class="pedidos-loading-overlay">
                            <div class="pedidos-loading-content" id="pedidos-loading-state">
                                <i class="bi bi-search pedidos-loading-spin"></i>
                                <span class="pedidos-loading-text">Buscando pedidos<span
                                        class="pedidos-loading-dots"><span>.</span><span>.</span><span>.</span></span></span>
                            </div>
                            <div class="pedidos-error-content d-none" id="pedidos-error-state">
                                <i class="bi bi-exclamation-triangle-fill pedidos-error-icon-overlay"></i>
                                <span class="pedidos-error-text" id="pedidos-error-text">Ocorreu um erro ao buscar os
                                    pedidos.</span>
                                <button type="button" class="btn btn-sm btn-outline-danger mt-2" id="btn-retry-pedidos">
                                    <i class="bi bi-arrow-clockwise"></i> Tentar novamente
                                </button>
                            </div>
                        </div>

                        <div id="pedidos-error-container" class="pedidos-error-container"></div>
                        <template id="tpl-pedidos-error-toast">
                            <div class="pedidos-error-toast" role="alert">
                                <i class="bi bi-exclamation-triangle-fill pedidos-error-icon"></i>
                                <div class="pedidos-error-msg"></div>
                                <button type="button" class="pedidos-error-close" title="Fechar">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </template>

                        <table class="table table-hover align-middle border-0 mb-0" id="tabela-pedidos">
                            <thead class="text-uppercase tabela-pedidos-head">
                                <tr>
                                    <th class="ps-3 border-0 fw-normal">
                                        <button id="btn-sort-data-pedidos"
                                            class="btn btn-link p-0 text-decoration-none text-dark d-flex align-items-center gap-1">
                                            Data <i id="icon-sort-data-pedidos" class="bi bi-arrow-down"></i>
                                        </button>
                                    </th>
                                    <th class="border-0 fw-normal">Cliente</th>
                                    <th class="border-0 fw-normal d-none d-md-table-cell">N. Serviço</th>
                                    <th class="border-0 fw-normal d-none d-md-table-cell">Motoboy</th>
                                    <th class="border-0 fw-normal">Status</th>
                                    <th class="text-end pe-3 border-0 fw-normal">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela-pedidos"></tbody>
                        </table>
                    </div>

                    <div class="card-footer bg-white border-0 d-flex justify-content-end pb-3 pe-3">
                        <div class="btn-group shadow-sm">
                            <button class="btn btn-light" id="btn-pag-prev-pedidos">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <button class="btn btn-light" id="info-paginacao-pedidos" disabled>
                                Pág 1
                            </button>
                            <button class="btn btn-light" id="btn-pag-next-pedidos">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="pedidos-pendentes" style="display:none;"></div>
        <div id="pedidos-andamento" style="display:none;"></div>
        <div id="pedidos-finalizados" style="display:none;"></div>
    </div>

    <div id="modal-pedidos-container"></div>
</div>
