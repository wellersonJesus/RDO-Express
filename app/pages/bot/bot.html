<div class="container-fluid p-0">
    <div id="bot-admin-form-container"></div>

    
        

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-3">
                    <div id="bot-logo-container"
                        style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;">
                        <i class="bi bi-gear-wide-connected" style="font-size:1.5rem;color:#FF0000;"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-0"><span style="color:#FF0000;">RDO</span> Express</h5>
                        <small id="bot-subtitulo" class="text-muted" style="font-size:0.72rem;">Painel de Gestão e
                            Automatização</small>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center bot-header-actions">
                    <button id="btn-status-bot" class="btn btn-master-off btn-sm rounded-pill px-3"
                        onclick="window.toggleMaster()">
                        MASTER OFF
                    </button>
                    <button id="btn-novo-bot" class="btn btn-danger btn-sm rounded-pill px-3"
                        onclick="window.abrirModalCadastro()">
                        <i class="bi bi-plus-lg" id="icon-novo-bot"></i> <span>Novo</span>
                    </button>
                    <button class="btn-sync-bot" onclick="window.reloadBot()" title="Atualizar">
                        <i id="sync-icon-bot" class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex gap-2 align-items-center">
                <select id="filtro-tipo" class="form-select form-select-sm rounded-pill"
                    style="width:150px;font-size:0.78rem;">
                    <option value="TODOS">Todos</option>
                    <option value="usuarios">Usuários</option>
                    <option value="clientes">Clientes</option>
                    <option value="colaboradores">Colaboradores</option>
                </select>
                <div class="input-group input-group-sm flex-grow-1">
                    <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                        <i class="bi bi-search text-muted" style="font-size:0.8rem;"></i>
                    </span>
                    <input id="busca-nome" type="text" class="form-control border-start-0 rounded-end-pill"
                        placeholder="Buscar por nome..." style="font-size:0.78rem;">
                </div>
            </div>

        
    

    
        <div class="table-responsive p-3">
            <table class="table table-hover align-middle border-0 mb-0" style="--bs-table-bg:transparent;--bs-table-bg-type:transparent;--bs-table-bg-state:transparent;">
                <thead class="text-uppercase" style="font-size:0.65rem;color:#999;letter-spacing:1px;">
                    <tr>
                        <th class="ps-3" style="width:60px;">
                            <div class="d-flex align-items-center gap-2">
                                <input type="checkbox" id="seletor-global-status" class="seletor-global-checkbox"
                                    title="Ativar/Desativar todos" disabled>
                                <span class="status-label-text">Status</span>
                            </div>
                        </th>
                        <th style="width:50px;">Avatar</th>
                        <th>Nome</th>
                        <th class="col-tipo" style="width:100px;">Tipo</th>
                        <th class="text-end pe-3" style="width:110px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="bot-list"></tbody>
            </table>
        </div>
        
            <small id="info-total" class="text-muted" style="font-size:0.72rem;"></small>
            <div class="btn-group shadow-sm float-end">
                <button class="btn btn-light btn-sm" onclick="window.mudarPagina(-1)">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="btn btn-light btn-sm" id="info-paginacao" disabled
                    style="min-width:100px;font-size:0.75rem;">Pág 1</button>
                <button class="btn btn-light btn-sm" onclick="window.mudarPagina(1)">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
